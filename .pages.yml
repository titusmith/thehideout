# Pages CMS (https://app.pagescms.org) editor for the work grid.
# Sign in there with GitHub and open titusmith/thehideout.
media:
  input: images/work
  output: images/work
  extensions: [jpg, jpeg, png, gif, webp]

content:
  - name: work
    label: Work
    type: file
    path: work.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: image
        label: Image
        type: image
        required: true
      - name: width
        label: Width
        type: number
        hidden: true
      - name: height
        label: Height
        type: number
        hidden: true
      - name: webflowUrl
        label: Old Webflow URL
        type: string
        hidden: true
